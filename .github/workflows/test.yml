name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  e2e:
    needs: test
    # Fork PRs have no access to repository secrets.
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/tier_maker_e2e
      NEON_WS_PROXY: 127.0.0.1:5433/v1?address=postgres:5432
      BETTER_AUTH_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      GOOGLE_CLIENT_ID: e2e-unused
      GOOGLE_CLIENT_SECRET: e2e-unused
      RESEND_API_KEY: re_e2e_unused
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: docker compose -f compose.e2e.yaml up -d --wait

      - run: e2e/migrate.sh

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
